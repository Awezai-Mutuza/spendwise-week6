
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Budget Tracker</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>SpendWise</h1>
        <p>Manage Your Money Wisely</p>
    </header>

    <main class="container">

        <!-- Dashboard Section -->
        <section class="dashboard">

            <div class="card">
                <h3>Starting Balance</h3>
                <p id="startingBalance">KSh 28,000</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">KSh 0</p>
            </div>

            <div class="card">
                <h3>Available Balance</h3>
                <p id="availableBalance">KSh 28,000</p>
            </div>

        </section>

        <!-- Budget Status -->
        <section class="budget-status">

            <h2>Budget Status</h2>

            <p id="budgetMessage">
                Welcome! Your budget is healthy.
            </p>

        </section>

        <!-- Add Expense Form -->
        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <label for="description">
                    Expense Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Food, Transport"
                    required
                >

                <label for="amount">
                    Amount (KSh)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Add Expense
                </button>

            </form>

        </section>

        <!-- Expense History -->
        <section class="expense-list">

            <h2>Expense History</h2>

            <div id="expenses">
                <p>No expenses recorded yet.</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            SpendWise © 2026 | Smart Budget Management
        </p>
    </footer>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
